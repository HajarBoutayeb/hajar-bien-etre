<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hajar</title>
<link rel="icon" type="image/png" href="icon-512.png">
<style>
:root{--fb:#f3f6f4;--cb:#fff;--ct:#0f172a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fb:#0e1210;--cb:#1e293b;--ct:#e2e8f0}}
html,body{height:100%;margin:0;background:var(--fb)}
#stage{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;right:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
iframe.off{display:none}
#bd{position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
#bd.on{opacity:1;visibility:visible}
#menu{position:fixed;left:0;top:0;width:56px;height:56px;z-index:99999;direction:ltr;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
#minis{pointer-events:none;position:absolute;right:0;bottom:calc(100% + 14px);display:flex;flex-direction:column-reverse;align-items:flex-end;gap:14px}
#menu.dn #minis{bottom:auto;top:calc(100% + 14px);flex-direction:column}
#menu.l #minis{right:auto;left:0;align-items:flex-start}
#menu.l .mini{flex-direction:row-reverse}
#minis .mini{padding:0 2px}
.fab{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.85);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .2s,background .25s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#main{background:#2b2f3a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:grab}
#main.drag{transform:scale(1.1);cursor:grabbing;box-shadow:0 10px 26px rgba(0,0,0,.45)}
#menu.open #main{transform:rotate(90deg)}
.mini{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(24px) scale(.6);transform-origin:center;transition:opacity .2s,transform .2s,visibility .2s}
#menu.open .mini{opacity:1;visibility:visible;transform:none;pointer-events:auto}
#menu.open .mini:nth-of-type(2){transition-delay:.04s}
.mini .fab{width:52px;height:52px}
.mini .fab svg{width:26px;height:26px}
.lbl{background:rgba(20,22,30,.9);color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.3);white-space:nowrap}
#cf{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
#cf.on{display:flex}
.cfb{background:var(--cb);color:var(--ct);border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.cfb p{margin:0 0 18px;white-space:pre-line;line-height:1.55;font-size:15px;unicode-bidi:plaintext;text-align:start}
.cfr{display:flex;gap:10px}
.cfr button{flex:1;padding:11px;border-radius:10px;border:1px solid #94a3b8;background:transparent;color:inherit;font:inherit;font-weight:600;cursor:pointer}
#cfo{background:#dc2626;border-color:#dc2626;color:#fff}
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:100000;background:rgba(20,22,30,.92);color:#fff;padding:10px 16px;border-radius:12px;font:14px system-ui,sans-serif;max-width:85%;display:none;text-align:center}

#auth{position:fixed;inset:0;z-index:100001;background:var(--fb);display:none;align-items:center;justify-content:center;padding:20px;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
#auth.on{display:flex}
.auth-card{background:var(--cb);color:var(--ct);border-radius:20px;padding:28px 24px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center}
.auth-card h1{margin:0 0 6px;font-size:26px}
.auth-sub{margin:0 0 18px;opacity:.75;font-size:14px;line-height:1.6}
.auth-sub-fr{font-size:12px;opacity:.7}
.auth-lb{display:block;text-align:right;font-size:14px;font-weight:600;margin:0 0 12px}
.auth-lb input{display:block;width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #94a3b8;background:var(--fb);color:var(--ct);font:inherit;box-sizing:border-box}
.auth-msg{min-height:20px;margin:0 0 10px;font-size:13px;line-height:1.5;color:#dc2626}
.auth-msg.ok{color:#16a34a}
.auth-btn{display:block;width:100%;padding:13px;margin:0 0 10px;border-radius:12px;border:0;background:#2b2f3a;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.auth-btn.pri{background:#2fa377}
.auth-btn.ghost{background:transparent;color:inherit;border:1px solid #94a3b8}
.auth-btn:disabled{opacity:.55;cursor:default}
.auth-note{margin:6px 0 0;font-size:12px;opacity:.65;line-height:1.5}
#logout{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:99998;background:rgba(20,22,30,.55);color:#fff;border:0;border-radius:999px;padding:6px 12px;font:12px system-ui,sans-serif;cursor:pointer}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="stage">
<iframe id="f-body" title="Suivi corps"></iframe>
<iframe id="f-habits" title="Suivi des habitudes" class="off"></iframe>
<iframe id="f-expenses" title="Mes Dépenses" class="off"></iframe>
<iframe id="f-nutrition" title="Nutrition" class="off"></iframe>
</div>
<div id="bd"></div>
<div id="cf"><div class="cfb"><p id="cfm"></p><div class="cfr"><button id="cfn" type="button">إلغاء</button><button id="cfo" type="button">تأكيد</button></div></div></div>
<div id="tt"></div>
<div id="menu">
<button id="main" class="fab" type="button" aria-expanded="false" aria-label="تغيير الصفحة"></button>
<div id="minis"></div>
</div>
<div id="auth" class="on"><div class="auth-card">
<h1>Hajar</h1>
<p class="auth-sub">سجّلي الدخول باش تتزامن معلوماتك بين التيليفون والكمبيوتر.<br><span class="auth-sub-fr">Connectez-vous pour synchroniser vos données entre le téléphone et l'ordinateur.</span></p>
<label class="auth-lb">البريد الإلكتروني
<input id="auth-email" type="email" dir="ltr" placeholder="exemple@gmail.com" autocomplete="email">
</label>
<label class="auth-lb">كلمة السر
<input id="auth-pass" type="password" dir="ltr" placeholder="6 أحرف على الأقل" autocomplete="current-password">
</label>
<p id="auth-msg" class="auth-msg"></p>
<button id="auth-in" type="button" class="auth-btn pri">تسجيل الدخول</button>
<button id="auth-up" type="button" class="auth-btn">إنشاء حساب جديد</button>
<button id="auth-off" type="button" class="auth-btn ghost" style="display:none">متابعة بدون مزامنة</button>
<p class="auth-note">بياناتك خاصة بك وحدك، ولا أحد غيرك يستطيع رؤيتها.</p>
</div></div>
<button id="logout" type="button" style="display:none">تسجيل الخروج</button>

display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}\n@media(min-width:760px){.dash{grid-template-columns:repeat(4,1fr)}}\n.kpi{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:16px;padding:14px;min-width:0}\n.kpi .t{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}\n.kpi .v{font-size:26px;font-weight:700;margin:4px 0 2px;white-space:nowrap;direction:ltr}\n[dir=rtl] .kpi .v{text-align:right}\n.kpi .v small{font-size:13px;font-weight:500;color:var(--mut)}\n.kpi .s{font-size:12px;color:var(--mut)}\n.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0 4px}\n.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:99px;transition:width .6s}\n.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}\n@media(min-width:620px){.g{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)!important}}\n.g3{grid-template-columns:repeat(3,1fr)}\nlabel{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}\ninput,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}\ninput:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}\nbutton{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);padding:9px 14px;transition:filter .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}\nbutton:hover{filter:brightness(1.12)}\nbutton.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:700}\nbutton.ghost{background:none;color:var(--mut);font-size:13px}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.sel{width:auto;min-width:150px}\ndetails summary{cursor:pointer;font-weight:600;padding:4px 0}\n.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--wn)}.ne{color:var(--mut)}\n.d{font-size:12px;font-weight:600;direction:ltr;display:inline-block}\n.chartbox{position:relative;height:280px;direction:ltr}\n.scroll{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}\nth,td{padding:8px;border-bottom:1px solid var(--bd);text-align:end}\nth:first-child,td:first-child{text-align:start}\nth{color:var(--mut);font-weight:600;font-size:12px}\ntd small{display:block}\ntd.n{text-align:start;white-space:normal;min-width:110px}\nth.act,td.act{position:sticky;inset-inline-end:0;background:var(--card);text-align:end;white-space:nowrap;border-inline-start:1px solid var(--bd)}\n.ab{padding:6px 8px!important;margin-inline-start:4px}\n.ab.del:hover{border-color:var(--dn);color:var(--dn)}\n.empty{color:var(--mut);text-align:center;padding:24px 0}\n.badge{background:var(--wn);color:#241600;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}\n.nb{display:inline-block;background:var(--nb);border:1px solid var(--bd);color:var(--mut);border-radius:99px;padding:1px 8px;font-size:11px;margin:1px 0 1px 3px;white-space:nowrap}\n[dir=rtl] .nb{margin:1px 3px 1px 0}\n.eq{font-size:11px;color:var(--ac);min-height:15px;margin-top:3px}\n.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}\n.tag{padding:5px 11px;font-size:13px;border-radius:99px}\n.tag.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chip{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;min-width:105px}\n.chip span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}\n.chip em{font-style:normal;font-size:11px;color:var(--mut);direction:ltr;text-align:start}\n.donuts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n.dnt{text-align:center;min-width:0}\n.dnt svg{width:100%;max-width:130px;height:auto;display:block;margin:0 auto 4px}\n.dnt b{display:block;font-size:13px}.dnt span{font-size:12px;color:var(--mut);direction:ltr;display:inline-block}\n@keyframes dnA{from{stroke-dashoffset:var(--c)}}\n.hbar{height:12px}\n.hpc{font-size:28px;font-weight:800;color:var(--ac)}\n.hb{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card2);cursor:pointer;transition:border-color .2s,background .2s}\n.hb.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card2))}\n.hb input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none;padding:0}\n.hb .hi{color:var(--ac);display:inline-flex}.hb .hn{flex:1;min-width:0}\n.hb.on .hn{text-decoration:line-through;text-decoration-color:var(--mut);color:var(--mut)}\n.hb.ed{cursor:default}\n.hin{padding:7px 9px}\n#io{display:none}\nfooter{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}\n<\/style>\n<\/head>\n<body>\n<main>\n<header>\n <div><h1><i data-ic=\"trend\"><\/i><span data-i18n=\"title\"><\/span><\/h1><p class=\"sub\" id=\"sub\"><\/p><\/div>\n <div class=\"row\" style=\"flex-wrap:nowrap\">\n  <button id=\"langb\" aria-label=\"Langue / اللغة\"><i data-ic=\"globe\"><\/i><span id=\"langt\"><\/span><\/button>\n  <button id=\"themeb\"><i id=\"themei\"><\/i><\/button>\n <\/div>\n<\/header>\n\n<section class=\"dash\">\n <div class=\"kpi\"><div class=\"t\"><i data-ic=\"scale\"><\/i><span data-i18n=\"k_weight\"><\/span><\/div><div class=\"v\" id=\"k1\">–<\/div><div class=\"s\" id=\"k1s\"><\/div><\/div>\n <div class=\"kpi\"><div class=\"t\"><i data-ic=\"swap\"><\/i><span data-i18n=\"k_diff\"><\/span><\/div><div class=\"v\" id=\"k2\">–<\/div><div class=\"s\" id=\"k2s\"><\/div><\/div>\n <div class=\"kpi\"><div class=\"t\"><i data-ic=\"target\"><\/i><span data-i18n=\"k_goal\"><\/span><\/div>\n  <div class=\"row\" style=\"flex-wrap:nowrap;gap:6px;margin-to n><button class=\"btn\" id=\"dclose\">Fermer<\/button><\/div>\n <div id=\"msg\"><\/div>\n<\/dialog>\n\n<script>\n/* FB-SYNC shim — routes localStorage for synced keys through the shell's Firebase bridge (window.parent.FB). Device-only keys keep using plain localStorage. Runs before the app's own script. */\n(function(){\n  var FB=null;\n  try{FB=window.parent.FB;}catch(e){FB=null;}\n  if(!FB||!FB.ready)return;\n  var SYNC={\"habit-tracker-v1\":1,\"habit-tracker-v1-theme\":1};\n  var LS=window.localStorage;\n  var _get=LS.getItem.bind(LS),_set=LS.setItem.bind(LS),_rem=LS.removeItem.bind(LS);\n  LS.getItem=function(k){\n    if(SYNC[k]){\n      var v=FB.cache[k];\n      if(v!==undefined&&v!==null)return v;\n      return _get(k);\n    }\n    return _get(k);\n  };\n  LS.setItem=function(k,v){\n    v=String(v);\n    if(SYNC[k]){\n      FB.cache[k]=v;\n      try{_set(k,v);}catch(e){}\n      FB.queueSave(k,v);\n      return;\n    }\n    try{_set(k,v);}catch(e){}\n  };\n  LS.removeItem=function(k){\n    if(SYNC[k]){\n      delete FB.cache[k];\n      try{_rem(k);}catch(e){}\n      FB.queueDelete(k);\n      return;\n    }\n    try{_rem(k);}catch(e){}\n  };\n})();\n<\/script>\n\n<script>\nconst $=s=>document.querySelector(s),KEY=\"habit-tracker-v1\";\nconst MONTHS=[\"Janvier\",\"Février\",\"Mars\",\"Avril\",\"Mai\",\"Juin\",\"Juillet\",\"Août\",\"Septembre\",\"Octobre\",\"Novembre\",\"Décembre\"];\nconst CATS={sp:\"Spirituel\",sa:\"Santé & Beauté\",ap:\"Apprentissage & Carrière\"};\nconst H=(n,c,g=30)=>({id:\"h\"+Math.random().toString(36).slice(2,9),name:n,cat:c,goal:g});\nconst defaults=()=>({habits:[\n H(\"صلاة الفجر\",\"sp\"),H(\"الصلوات الخمس\",\"sp\"),H(\"ورد القرآن اليومي\",\"sp\"),H(\"أذكار الصباح والمساء\",\"sp\"),\n H(\"الاستيقاظ قبل 08:00 صباحا\",\"sa\"),H(\"شرب 2 لتر\",\"sa\"),H(\"الرياضة\",\"sa\",14),H(\"النوم 7-8 ساعات\",\"sa\"),H(\"نظام غذائي صحي\",\"sa\"),H(\"العناية بالشعر\",\"sa\",8),H(\"غسل الأسنان\",\"sa\"),\n H(\"تعلم اللغة الإنجليزية\",\"ap\"),H(\"تعلم الل if(!APPS[start]){start="body";try{var l=localStorage.getItem("combo-last");if(APPS[l])start=l}catch(e){}}
initPos();
show(start,true);
setTimeout(function(){if(!window.FBBoot){var a=document.getElementById("auth");if(a)a.classList.remove("on");ORDER.forEach(function(n){if(!frames[n].srcdoc)frames[n].srcdoc=DOCS[n]})}},2000);
</script>
<script>
/* Firebase sync for "Hajar" — auth gate + Firestore mirror of localStorage.
   Project: tatbiqati-51aab (Spark plan). Data lives under users/{uid}/apps/*,
   one Firestore document per localStorage key. localStorage stays as offline cache. */
(function(){
  "use strict";
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyBw54sbEiMZsUvrqSuMMzJMtBkxf961R3Y",
    authDomain: "tatbiqati-51aab.firebaseapp.com",
    projectId: "tatbiqati-51aab",
    storageBucket: "tatbiqati-51aab.firebasestorage.app",
    messagingSenderId: "133635405434",
    appId: "1:133635405434:web:27ea87d600e447659f6dc3"
  };
  var SYNC_KEYS = ["body-tracker-v2","body-tracker-ui","habit-tracker-v1","habit-tracker-v1-theme","dash_depenses_v1","nutri_v1","nutri-ai-v1"];
  var DOC_FOR = {
    "body-tracker-v2":"body",
    "body-tracker-ui":"body-ui",
    "habit-tracker-v1":"habits",
    "habit-tracker-v1-theme":"habits-ui",
    "dash_depenses_v1":"expenses",
    "nutri_v1":"nutrition",
    "nutri-ai-v1":"nutrition-ai"
  };
  var MIGRATED_FLAG = "fb-migrated";

  function $(id){ return document.getElementById(id); }
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
  function isObj(v){ return v && typeof v === "object" && !Array.isArray(v); }
  function parseVal(raw){
    if(raw===null||raw===undefined) return undefined;
    try{ return JSON.parse(raw); }catch(e){ return raw; }
  }
  function strVal(v){ return (typeof v === "string") ? v : JSON.stringify(v); }
  function countFilled(v){
    if(!isObj(v)) return (v===null||v===undefined||v==="") ? 0 : 1;
    var n=0;
    Object.keys(v).forEach(function(k){
      var x=v[k];
      if(x===null||x===undefined||x==="") return;
      if(Array.isArray(x)) n+=x.length;
      else if(isObj(x)) n+=countFilled(x);
      else n+=1;
    });
    return n;
  }
  /* Deterministic pick between two conflicting values (same id/date on two
     devices): more filled fields wins, tie -> lexicographically larger JSON.
     Symmetric, so merging is idempotent no matter which device merges first. */
  function pickConflict(a,b){
    var sa=JSON.stringify(a), sb=JSON.stringify(b);
    if(sa===sb) return a;
    var ca=countFilled(a), cb=countFilled(b);
    if(ca!==cb) return ca>cb ? a : b;
    return sa>sb ? a : b;
  }
  function mergeById(arrA, arrB, idFn){
    var map={}, order=[];
    (arrA||[]).concat(arrB||[]).forEach(function(it){
      if(!it) return;
      var id=idFn(it);
      if(id===undefined||id===null) return;
      if(map[id]===undefined){ map[id]=it; order.push(id); }
      else { map[id]=pickNewer(map[id], it); }
    });
    return order.map(function(id){ return map[id]; });
  }
  /* Last-write-wins when both versions carry a numeric updated-at stamp
     (t, set by the app on every save); otherwise the deterministic pick.
     Only items that carry t are affected, so older data merges as before. */
  function pickNewer(a,b){
    var ta=(a&&typeof a.t==="number")?a.t:0, tb=(b&&typeof b.t==="number")?b.t:0;
    if(ta>0&&tb>0) return ta>=tb?a:b;
    return pickConflict(a,b);
  }
  /* Union of two tombstone maps {id: timestamp}; keep the newest stamp. */
  function mergeDel(a,b){
    var out={};
    [a,b].forEach(function(m){
      if(!isObj(m)) return;
      Object.keys(m).forEach(function(k){ if(!out[k]||m[k]>out[k]) out[k]=m[k]; });
    });
    return out;
  }
  /* Per-document merge of a cloud value and a local value. Settings / AI-key
     docs: cloud wins. Data docs: union by date/id, last-write-wins per day
     approximated by the deterministic pick above. */
  function mergeDocs(docId, cloud, local){
    if(!isObj(cloud) || !isObj(local)) return cloud;
    var out, k;
    if(docId==="body"){
      out={};
      out.entries=mergeById(cloud.entries, local.entries, function(e){return e.d;});
      out.checks={};
      var c1=cloud.checks||{}, c2=local.checks||{};
      Object.keys(c1).concat(Object.keys(c2)).forEach(function(dt){
        var s={};
        (c1[dt]||[]).concat(c2[dt]||[]).forEach(function(h){ s[h]=1; });
        out.checks[dt]=Object.keys(s);
      });
      out.habits=mergeById(cloud.habits, local.habits, function(h){return h.id;});
      out.iv=(cloud.iv!==null&&cloud.iv!==undefined)?cloud.iv:local.iv;
      out.goal=(cloud.goal!==null&&cloud.goal!==undefined)?cloud.goal:local.goal;
      out.height=(cloud.height!==null&&cloud.height!==undefined)?cloud.height:local.height;
      return out;
    }
    if(docId==="habits"){
      out={};
      out.habits=mergeById(cloud.habits, local.habits, function(h){return h.id;});
      out.months={};
      var m1=cloud.months||{}, m2=local.months||{};
      Object.keys(m1).concat(Object.keys(m2)).forEach(function(mo){
        if(out.months[mo]!==undefined) return;
        var a=m1[mo]||{c:{},o:{}}, b=m2[mo]||{c:{},o:{}};
        var mm={c:{},o:{}};
        ["c","o"].forEach(function(kind){
          var hh={};
          Object.keys(a[kind]||{}).concat(Object.keys(b[kind]||{})).forEach(function(hid){
            var days={};
            (a[kind][hid]||[]).concat(b[kind][hid]||[]).forEach(function(d){ days[d]=1; });
            hh[hid]=Object.keys(days).map(Number).sort(function(x,y){return x-y;});
          });
          mm[kind]=hh;
        });
        out.months[mo]=mm;
      });
      /* Dedupe by name: the mini-app can seed the same 14 defaults with
         different ids on another device, and a plain union by id would keep
         both copies forever. Keep one copy per name (the one with the most
         checked days) and union all copies' days into it. */
      var byName={};
      out.habits.forEach(function(h){
        (byName[h.name]=byName[h.name]||[]).push(h);
      });
      var keepIds={}, kept=[];
      Object.keys(byName).forEach(function(name){
        var copies=byName[name];
        var best=copies[0], bestN=-1;
        copies.forEach(function(h){
          var n=0;
          Object.keys(out.months).forEach(function(mo){
            n+=((out.months[mo].c||{})[h.id]||[]).length;
          });
          if(n>bestN){ bestN=n; best=h; }
        });
        keepIds[best.id]=1; kept.push(best);
        Object.keys(out.months).forEach(function(mo){
          ["c","o"].forEach(function(kind){
            var acc={};
            copies.forEach(function(h){
              ((out.months[mo][kind]||{})[h.id]||[]).forEach(function(d){ acc[d]=1; });
            });
            var days=Object.keys(acc).map(Number).sort(function(a,b){return a-b;});
            if(!out.months[mo][kind]) out.months[mo][kind]={};
            if(days.length) out.months[mo][kind][best.id]=days;
            copies.forEach(function(h){
              if(h.id!==best.id) delete out.months[mo][kind][h.id];
            });
          });
        });
      });
      out.habits=kept;
      out.mood={};
      var md1=cloud.mood||{}, md2=local.mood||{};
      Object.keys(md1).concat(Object.keys(md2)).forEach(function(dt){
        if(out.mood[dt]!==undefined) return;
        if(md1[dt] && md2[dt]) out.mood[dt]=pickConflict(md1[dt], md2[dt]);
        else out.mood[dt]=md1[dt]||md2[dt];
      });
      if(cloud.seed202611||local.seed202611) out.seed202611=1;
      return out;
    }
    if(docId==="expenses"){
      out={};
      /* An emptied cloud list wins: otherwise the old local transactions
         would be merged back in on every sign-in and could never be cleared. */
      if(cloud.tx && cloud.tx.length===0) out.tx=[];
      else out.tx=mergeById(cloud.tx, local.tx, function(t){return t.id;});
      out.cats=mergeById(cloud.cats, local.cats, function(c){return c.n;});
      out.nid=Math.max(cloud.nid||0, local.nid||0);
      out.theme=(cloud.theme!==null&&cloud.theme!==undefined)?cloud.theme:local.theme;
      out.lang=cloud.lang||local.lang||"fr";
      return out;
    }
    if(docId==="nutrition"){
      out={};
      /* Tombstones: ids explicitly deleted on either side (recorded by delE /
         delC with a timestamp). A deleted id never comes back through the
         union, whatever the other copy still holds. Meal keys are
         "day|meal|id" (meal ids repeat across days/meals), custom keys are
         the food id itself ("c..."). */
      var del=mergeDel(cloud.del, local.del);
      out.del=del;
      /* Food overrides (edited built-in values) merge per fid,
         last-write-wins by t (pickNewer). Deleted built-in foods merge
         as a union keeping the newest t per fid (mergeDel, same as S.del). */
      var delFood=mergeDel(cloud.delFood, local.delFood);
      out.delFood=delFood;
      var ovr={};
      var o1=cloud.ovr||{}, o2=local.ovr||{};
      Object.keys(o1).concat(Object.keys(o2)).forEach(function(fid){
        if(ovr[fid]!==undefined) return;
        if(o1[fid] && o2[fid]) ovr[fid]=pickNewer(o1[fid], o2[fid]);
        else ovr[fid]=o1[fid]||o2[fid];
      });
      out.ovr=ovr;
      out.days={};
      var d1=cloud.days||{}, d2=local.days||{};
      Object.keys(d1).concat(Object.keys(d2)).forEach(function(dt){
        if(out.days[dt]!==undefined) return;
        var a=d1[dt], b=d2[dt];
        if(a && b){
          var day={};
          ["bf","lu","di","sk"].forEach(function(meal){
            day[meal]=mergeById(a[meal], b[meal], function(it){return it.id;}).filter(function(it){ return !del[dt+"|"+meal+"|"+it.id] && !delFood[it.fid]; });
          });
          var wl=Math.max(a.wl||0, b.wl||0);
          if(wl>0 || a.wl!==undefined || b.wl!==undefined) day.wl=wl;
          out.days[dt]=day;
        } else { var only=a||b; if(only){ ["bf","lu","di","sk"].forEach(function(meal){ if(only[meal]) only[meal]=only[meal].filter(function(it){ return !delFood[it.fid]; }); }); } out.days[dt]=only; }
      });
      out.custom=mergeById(cloud.custom, local.custom, function(c){return c.id;}).filter(function(c){ return !del[c.id]; });
      out.nid=Math.max(cloud.nid||0, local.nid||0);
      if(cloud.prof && local.prof) out.prof=pickConflict(cloud.prof, local.prof);
      else out.prof=cloud.prof||local.prof||null;
      out.lang=cloud.lang||local.lang||"ar";
      out.theme=(cloud.theme!==null&&cloud.theme!==undefined)?cloud.theme:local.theme;
      return out;
    }
    return cloud;
  }

  /* Bridge used by the in-iframe shims. Defined early so shims never throw. */
  var FB = {
    ready:false, uid:null, db:null, auth:null, cache:{}, timers:{}, delTimers:{},
    docFor: DOC_FOR,
    queueSave:function(key, strVal){
      if(!FB.db || !FB.uid) return;
      if(FB.delTimers[key]){ clearTimeout(FB.delTimers[key]); delete FB.delTimers[key]; }
      clearTimeout(FB.timers[key]);
      FB.timers[key]=setTimeout(function(){
        delete FB.timers[key];
        var parsed;
        try{ parsed=JSON.parse(strVal); }catch(e){ parsed=strVal; }
        FB.db.collection("users").doc(FB.uid).collection("apps").doc(DOC_FOR[key])
          .set({data: parsed})
          .catch(function(){ /* stays in local cache; retried on next save */ });
      }, 800);
    },
    queueDelete:function(key){
      if(!FB.db || !FB.uid) return;
      if(FB.timers[key]){ clearTimeout(FB.timers[key]); delete FB.timers[key]; }
      clearTimeout(FB.delTimers[key]);
      FB.delTimers[key]=setTimeout(function(){
        delete FB.delTimers[key];
        FB.db.collection("users").doc(FB.uid).collection("apps").doc(DOC_FOR[key])
          .delete().catch(function(){});
      }, 800);
    }
  };
  window.FB = FB;

  function docRef(docId){
    return FB.db.collection("users").doc(FB.uid).collection("apps").doc(docId);
  }
  function getDocSafe(ref){
    return Promise.race([
      ref.get(),
      new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("timeout")); }, 10000); })
    ]);
  }

  /* One-time migration + load: for each synced key, reconcile Firestore and
     localStorage, fill FB.cache, and keep localStorage as offline cache. */
  async function syncAll(){
    var migrated=[];
    var syncOk=true;
    var flagKey=MIGRATED_FLAG+"-"+FB.uid;
    var migratedFlag=lsGet(flagKey)==="1";
    /* body legacy key v1 -> v2 (local only, before syncing) */
    if(!lsGet("body-tracker-v2")){
      var v1=lsGet("body-tracker-v1");
      if(v1) lsSet("body-tracker-v2", v1);
    }
    for(var i=0;i<SYNC_KEYS.length;i++){
      var key=SYNC_KEYS[i], docId=DOC_FOR[key];
      var localRaw=lsGet(key);
      var snap=null;
      try{ snap=await getDocSafe(docRef(docId)); }
      catch(e){ snap=null; syncOk=false; }
      if(snap && snap.exists){
        var cloudVal=snap.data() ? snap.data().data : undefined;
        if(localRaw!==null && localRaw!==undefined){
          var cloudStr=strVal(cloudVal);
          if(cloudStr!==localRaw){
            var merged=mergeDocs(docId, cloudVal, parseVal(localRaw));
            var mergedStr=strVal(merged);
            FB.cache[key]=mergedStr;
            lsSet(key, mergedStr);
            try{ await docRef(docId).set({data: merged}); }
            catch(e){ syncOk=false; }
            migrated.push(key);
          } else {
            FB.cache[key]=localRaw;
          }
        } else {
          var cs=strVal(cloudVal);
          FB.cache[key]=cs;
          lsSet(key, cs);
        }
      } else if(snap){
        /* document does not exist in the cloud */
        if(localRaw!==null && localRaw!==undefined){
          if(!migratedFlag){
            /* first migration on this account: upload local data */
            var parsed=parseVal(localRaw);
            try{ await docRef(docId).set({data: parsed}); }
            catch(e){ syncOk=false; }
            FB.cache[key]=localRaw;
            migrated.push(key);
          } else {
            /* this device synced before and the cloud doc is gone:
               the data was deleted elsewhere — do not re-upload it */
            lsDel(key);
            delete FB.cache[key];
          }
        }
      } else {
        /* Firestore unreachable: keep local data as cache, upload nothing */
        if(localRaw!==null && localRaw!==undefined) FB.cache[key]=localRaw;
      }
    }
    if(syncOk) lsSet(flagKey, "1");
    return migrated;
  }

  var appsLoaded=false;
  function loadApps(){
    if(appsLoaded) return;
    appsLoaded=true;
    try{
      ORDER.forEach(function(n){ frames[n].srcdoc=DOCS[n]; });
    }catch(e){}
  }
  function loadAppsOffline(){
    FB.ready=false;
    hideGate();
    loadApps();
  }

  function setMsg(text, isErr){
    var m=$("auth-msg");
    if(!m) return;
    m.textContent=text||"";
    m.classList.toggle("ok", !isErr && !!text);
  }
  function setBusy(b){
    ["auth-in","auth-up"].forEach(function(id){
      var el=$(id); if(el) el.disabled=b;
    });
  }
  function showGate(){
    var g=$("auth"); if(g) g.classList.add("on");
    var lo=$("logout"); if(lo) lo.style.display="none";
    setBusy(false);
  }
  function hideGate(){
    var g=$("auth"); if(g) g.classList.remove("on");
    var lo=$("logout"); if(lo) lo.style.display="block";
    setBusy(false);
  }
  function showOfflineGate(){
    showGate();
    setMsg("تعذّر الاتصال بـ Firebase — تحققي من الإنترنت. يمكنك المتابعة بدون مزامنة.", true);
    var off=$("auth-off"); if(off) off.style.display="block";
    /* sign-in / sign-up cannot work without the Firebase SDK */
    ["auth-in","auth-up"].forEach(function(id){
      var el=$(id); if(el) el.disabled=true;
    });
  }

  var AUTH_ERR = {
    "auth/invalid-email": "البريد الإلكتروني غير صحيح",
    "auth/user-not-found": "لا يوجد حساب بهذا البريد — أنشئي حساباً جديداً",
    "auth/wrong-password": "كلمة السر غير صحيحة",
    "auth/email-already-in-use": "هذا البريد مسجّل already — سجّلي الدخول",
    "auth/weak-password": "كلمة السر قصيرة — 6 أحرف على الأقل",
    "auth/too-many-requests": "محاولات كثيرة — انتظري قليلاً ثم أعيدي المحاولة",
    "auth/network-request-failed": "لا يوجد اتصال بالإنترنت — تحققي من الشبكة",
    "auth/user-disabled": "هذا الحساب معطّل",
    "auth/operation-not-allowed": "تسجيل الدخول بالبريد غير مفعّل"
  };
  function authErrMessage(err){
    if(err && err.code && AUTH_ERR[err.code]) return AUTH_ERR[err.code];
    return (err && err.message) ? err.message : "حدث خطأ — أعيدي المحاولة";
  }
  function readCreds(){
    var email=$("auth-email").value.trim();
    var pass=$("auth-pass").value;
    if(!email || email.indexOf("@")<0){ setMsg("أدخلي بريداً إلكترونياً صحيحاً", true); return null; }
    if(!pass || pass.length<6){ setMsg("كلمة السر 6 أحرف على الأقل", true); return null; }
    return {email:email, pass:pass};
  }
  function signIn(){
    if(!FB.auth){ setMsg("تعذّر الاتصال بـ Firebase — تحققي من الإنترنت.", true); return; }
    var c=readCreds(); if(!c) return;
    setBusy(true); setMsg("جارٍ تسجيل الدخول…", false);
    FB.auth.signInWithEmailAndPassword(c.email, c.pass).catch(function(err){
      setBusy(false);
      setMsg(authErrMessage(err), true);
    });
  }
  function signUp(){
    if(!FB.auth){ setMsg("تعذّر الاتصال بـ Firebase — تحققي من الإنترنت.", true); return; }
    var c=readCreds(); if(!c) return;
    setBusy(true); setMsg("جارٍ إنشاء الحساب…", false);
    FB.auth.createUserWithEmailAndPassword(c.email, c.pass).catch(function(err){
      setBusy(false);
      setMsg(authErrMessage(err), true);
    });
  }
  function wireGate(){
    var si=$("auth-in"); if(si) si.addEventListener("click", signIn);
    var su=$("auth-up"); if(su) su.addEventListener("click", signUp);
    var off=$("auth-off"); if(off) off.addEventListener("click", loadAppsOffline);
    var pw=$("auth-pass");
    if(pw) pw.addEventListener("keydown", function(e){ if(e.key==="Enter") signIn(); });
    var em=$("auth-email");
    if(em) em.addEventListener("keydown", function(e){ if(e.key==="Enter") signIn(); });
    var lo=$("logout");
    if(lo) lo.addEventListener("click", function(){
      if(FB.auth){ FB.auth.signOut().catch(function(){}); }
      setTimeout(function(){ location.reload(); }, 400);
    });
  }

  function start(){
    wireGate();
    if(typeof firebase === "undefined"){ showOfflineGate(); return; }
    try{
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    }catch(e){ showOfflineGate(); return; }
    try{ FB.auth=firebase.auth(); FB.db=firebase.firestore(); }
    catch(e){ showOfflineGate(); return; }
    try{ FB.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
    try{
      var pr=FB.db.enablePersistence({synchronizeTabs:true});
      if(pr && pr.catch) pr.catch(function(){});
    }catch(e){}
    FB.auth.onAuthStateChanged(function(user){
      if(user){
        FB.uid=user.uid;
        setMsg("جارٍ مزامنة بياناتك…", false);
        setBusy(true);
        syncAll().then(function(migrated){
          FB.ready=true;
          hideGate();
          loadApps();
          if(migrated && migrated.length){
            setTimeout(function(){ try{ toast("تمت مزامنة بياناتك القديمة إلى السحابة ✓"); }catch(e){} }, 700);
          }
        }).catch(function(){
          FB.ready=true;
          hideGate();
          loadApps();
        });
      } else {
        FB.ready=false; FB.uid=null;
        showGate();
      }
    });
  }

  window.FBBoot={ start: start };
  FBBoot.start();
})();

</script>
